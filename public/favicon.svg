<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GrandPlex">
  <rect width="32" height="32" fill="#0B0B0D"/>
  <!-- The film rhythm, down both edges — the same motif as the wordmark. -->
  <g fill="#e8401c" opacity="0.85">
    <rect x="3" y="6" width="2.5" height="2.5"/>
    <rect x="3" y="12" width="2.5" height="2.5"/>
    <rect x="3" y="18" width="2.5" height="2.5"/>
    <rect x="26.5" y="6" width="2.5" height="2.5"/>
    <rect x="26.5" y="12" width="2.5" height="2.5"/>
    <rect x="26.5" y="18" width="2.5" height="2.5"/>
  </g>
  <!-- G and P drawn as paths, not typeset: a favicon renderer has no fonts. -->
  <g fill="#efebe3">
    <path d="M14.1 7.4a6.5 6.5 0 1 0 6.4 7.6h-6.4v2.5h9v-1.1a9 9 0 1 0-2.7 6.4l-1.8-1.8a6.5 6.5 0 0 1-4.5 1.9 6.5 6.5 0 0 1 0-13z" transform="translate(-2.6 -1.4) scale(0.86)"/>
    <path d="M18.9 8.2h4.4a3.6 3.6 0 0 1 0 7.2h-2v3.4h-2.4V8.2zm2.4 2.2v2.8h1.9a1.4 1.4 0 0 0 0-2.8h-1.9z" transform="translate(0.6 -0.4) scale(0.94)"/>
  </g>
  <!-- The lit screen edge, under the mark. -->
  <rect x="8" y="24.5" width="16" height="2.4" fill="#e8401c"/>
</svg>
